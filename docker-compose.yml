version: '3.8'

services:
  api:
    build: .
    container_name: surface_defect_api
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=models/onnx/defect_detector.onnx
      - CONFIDENCE_THRESHOLD=0.5
      - IOU_THRESHOLD=0.45
      - FLASK_ENV=production
    restart: always
